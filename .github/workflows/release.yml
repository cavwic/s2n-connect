name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            archive: zip
          - runner: windows-latest
            rid: win-arm64
            archive: zip
          - runner: macos-latest
            rid: osx-x64
            archive: tar
          - runner: macos-latest
            rid: osx-arm64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-x64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-arm64
            archive: tar

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: >
          dotnet publish src/S2N.App/S2N.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o artifacts/${{ matrix.rid }}

      - name: Archive and checksum on Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "S2N-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "$name.sha256"

      - name: Archive and checksum on Unix
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          name="S2N-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz"
          tar -C "artifacts/${{ matrix.rid }}" -czf "$name" .
          shasum -a 256 "$name" > "$name.sha256"

      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: S2N-${{ github.ref_name }}-${{ matrix.rid }}.*

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            S2N-${{ github.ref_name }}-${{ matrix.rid }}.*
