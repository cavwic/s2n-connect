name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  android:
    name: Android build and smoke tests
    uses: ./.github/workflows/android.yml

  regression-checks:
    name: Check routing and settings regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/S2N.ConfigChecks/S2N.ConfigChecks.csproj --configuration Release
      - name: Check release package integrity handling
        run: dotnet run --project tests/S2N.ReleaseChecks/S2N.ReleaseChecks.csproj --configuration Release
      - name: Check mobile profile export
        run: dotnet run --project tests/S2N.MobileExportChecks/S2N.MobileExportChecks.csproj --configuration Release
      - name: Check safe connection profile imports
        run: dotnet run --project tests/S2N.ProfileImportChecks/S2N.ProfileImportChecks.csproj --configuration Release
      - name: Check TUN ownership and startup lifecycle
        run: dotnet run --project tests/S2N.TunChecks/S2N.TunChecks.csproj --configuration Release
      - name: Check VPS deployment safety
        run: dotnet run --project tests/S2N.DeploymentChecks/S2N.DeploymentChecks.csproj --configuration Release
      - name: Check isolated server deployment and rollback
        run: python3 -m unittest discover -s tests/S2N.DeploymentChecks -p 'test_*.py' -v
      - name: Verify real local QUIC transport and TLS rejection
        run: python3 scripts/test-hysteria-loopback.py

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            archive: zip
          - runner: windows-latest
            rid: win-arm64
            archive: zip
          - runner: macos-latest
            rid: osx-x64
            archive: tar
          - runner: macos-latest
            rid: osx-arm64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-x64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-arm64
            archive: tar

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore target runtime
        run: dotnet restore src/S2N.App/S2N.App.csproj --runtime ${{ matrix.rid }}
      - name: Publish self-contained application
        run: >-
          dotnet publish src/S2N.App/S2N.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:ContinuousIntegrationBuild=true
          --output artifacts/${{ matrix.rid }}

      - name: Include desktop licenses and documentation
        shell: pwsh
        run: |
          ./scripts/copy-release-docs.ps1 -OutputPath "artifacts/${{ matrix.rid }}"

      - name: Fetch verified core for Windows TUN checks
        if: matrix.rid == 'win-x64'
        run: python scripts/fetch-test-core.py --output artifacts/native-core
      - name: Verify three real Windows TUN first starts and cancellation
        if: matrix.rid == 'win-x64'
        run: dotnet run --project tests/S2N.TunChecks/S2N.TunChecks.csproj --configuration Release -- --native-windows artifacts/native-core/sing-box.exe artifacts/native-tun
      - name: Validate generated desktop and iOS JSON with the verified core
        if: matrix.rid == 'win-x64'
        env:
          S2N_CONFIGCHECK_CORE: ${{ github.workspace }}/artifacts/native-core/sing-box.exe
        run: |
          dotnet run --project tests/S2N.ConfigChecks/S2N.ConfigChecks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/S2N.MobileExportChecks/S2N.MobileExportChecks.csproj --configuration Release
      - name: Preserve Windows TUN evidence
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: native-tun-win-x64
          path: artifacts/native-tun
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "S2N-${{ matrix.rid }}.zip"

      - name: Archive Unix
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C "artifacts/${{ matrix.rid }}" -czf "S2N-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: S2N-${{ matrix.rid }}
          path: S2N-${{ matrix.rid }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
