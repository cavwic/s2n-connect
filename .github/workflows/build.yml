name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  regression-checks:
    name: Check routing and settings regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/S2N.ConfigChecks/S2N.ConfigChecks.csproj --configuration Release

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            archive: zip
          - runner: windows-latest
            rid: win-arm64
            archive: zip
          - runner: macos-latest
            rid: osx-x64
            archive: tar
          - runner: macos-latest
            rid: osx-arm64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-x64
            archive: tar
          - runner: ubuntu-latest
            rid: linux-arm64
            archive: tar

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore target runtime
        run: dotnet restore src/S2N.App/S2N.App.csproj --runtime ${{ matrix.rid }}
      - name: Publish self-contained application
        run: >-
          dotnet publish src/S2N.App/S2N.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:ContinuousIntegrationBuild=true
          --output artifacts/${{ matrix.rid }}

      - name: Archive Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "S2N-${{ matrix.rid }}.zip"

      - name: Archive Unix
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C "artifacts/${{ matrix.rid }}" -czf "S2N-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: S2N-${{ matrix.rid }}
          path: S2N-${{ matrix.rid }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
